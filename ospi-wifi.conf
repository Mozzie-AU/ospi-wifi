# /etc/ospi-wifi.conf - settings for the OSPi WiFi fallback hotspot and setup console.
# After changing anything: sudo systemctl restart ospi-wifi

# WiFi interface (check with: ip link)
IFACE=wlan0

# Two-letter country code. Raspberry Pi OS keeps WiFi switched off until this is set.
# Only install.sh uses it.
WIFI_COUNTRY=AU

# Setup hotspot. Leave HOTSPOT_SSID blank to use OSPi-Setup-XXXX (end of the MAC address).
# The password must be 8-63 characters. Leave it blank for an open hotspot.
HOTSPOT_SSID=
HOTSPOT_PASSWORD=opensprinkler
HOTSPOT_ADDRESS=192.168.4.1/24
HOTSPOT_CHANNEL=6

# Setup console port. OpenSprinkler itself stays on OSPI_PORT.
CONSOLE_PORT=8090
OSPI_PORT=8080

# Password for the console when it's opened from the home network (user name: anything).
# Not asked for on the hotspot, which already has its own password. Blank = no password.
CONSOLE_PASSWORD=

# Port 80 redirect: on the hotspot it opens the setup console (phones show a
# "sign in to network" pop-up); on the home network it goes to OpenSprinkler.
# Set to 0 to turn this off.
PORTAL_PORT=80

# Timing, in seconds.
# BOOT_GRACE: how long to wait for WiFi after the service starts.
# DISCONNECT_GRACE: how long a dropped connection can last before falling back.
# RETRY_INTERVAL: while the hotspot is idle (nobody connected, console unused),
#   how often to check whether a saved network is back. 0 = stay on the hotspot.
# CONNECT_TIMEOUT: how long to wait when joining a network.
BOOT_GRACE=90
DISCONNECT_GRACE=60
RETRY_INTERVAL=300
CONNECT_TIMEOUT=45

DEBUG=no
